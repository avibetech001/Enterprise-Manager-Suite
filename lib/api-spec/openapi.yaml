          description: Appraisals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appraisal"
    post:
      operationId: createAppraisal
      tags: [appraisals]
      summary: Create an appraisal for an employee (management)
      requestBody:
        required: true
        content:
          application/json:
