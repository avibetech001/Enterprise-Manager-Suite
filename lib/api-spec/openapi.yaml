components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SetupStatus:
      type: object
      required: [isSetupComplete]
      properties:
        isSetupComplete:
          type: boolean

    SetupInput:
      type: object
      required:
        [
          companyName,
          employerFullName,
          companyEmail,
          phone,
          password,
          confirmPassword,
        ]
      properties:
        companyName:
          type: string
          minLength: 1
        employerFullName:
          type: string
          minLength: 1
        companyEmail:
          type: string
        phone:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        confirmPassword:
          type: string
          minLength: 8

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    Role:
      type: string
      enum: [super_admin, hr, employee]

    UserStatus:
      type: string
      enum: [active, pending, inactive, suspended]

    EmploymentType:
      type: string
      enum: [full_time, part_time, contract, intern]

    EmploymentStatus:
      type: string
      enum: [probation, active, on_leave, suspended, terminated]

    PermissionKey:
      type: string
