        gender:
          type: string
        dateOfBirth:
          type: string
        nationality:
          type: string
        phone:
          type: string
          minLength: 1
        personalEmail:
          type: string
        companyEmail:
          type: string
        residentialAddress:
          type: string
        state:
          type: string
        city:
          type: string
        profilePhotoUrl:
          type: string
        emergencyContact:
