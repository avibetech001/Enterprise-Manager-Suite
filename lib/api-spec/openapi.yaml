        departmentId:
          type: ["integer", "null"]
        jobTitle:
          type: ["string", "null"]
        employmentType:
          oneOf:
            - $ref: "#/components/schemas/EmploymentType"
            - type: "null"
        startDate:
          type: ["string", "null"]
        employmentStatus:
