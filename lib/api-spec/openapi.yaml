components:
  schemas:
    AppraisalRating:
      type: object
      required: [criterion, score]
      properties:
        criterion:
          type: string
          minLength: 1
        score:
          type: integer
          minimum: 1
          maximum: 5

    Appraisal:
      type: object
      required:
        [id, userId, userName, createdBy, createdByName, periodLabel, ratings, overallComment, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        createdBy:
          type: integer
        createdByName:
          type: string
        periodLabel:
          type: string
        ratings:
          type: array
          items:
            $ref: "#/components/schemas/AppraisalRating"
        overallComment:
          type: string
        createdAt:
          type: string
          format: date-time

    AppraisalInput:
      type: object
      required: [userId, ratings]
      properties:
        userId:
          type: integer
        periodLabel:
          type: string
        ratings:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AppraisalRating"
        overallComment:
          type: string

    AppraisalDeleteResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    ChatGroup:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [company, department]

    ChatMember:
      type: object
      required: [id, fullName]
      properties:
        id:
          type: integer
        fullName:
          type: string

    PrivateConversation:
      type: object
      required: [id, otherUserId, otherUserName, createdAt]
      properties:
        id:
          type: integer
        otherUserId:
          type: integer
        otherUserName:
          type: string
        createdAt:
          type: string
          format: date-time

    PrivateConversationInput:
      type: object
      required: [employeeId]
      properties:
        employeeId:
          type: integer

    ChatMessage:
      type: object
      required:
        [id, groupId, userId, userName, body, filePath, fileName, mentionUserIds, createdAt]
      properties:
        id:
          type: integer
        groupId:
          type: string
        userId:
          type: integer
        userName:
          type: string
        body:
          type: string
        filePath:
          type: string
          nullable: true
        fileName:
          type: string
          nullable: true
        mentionUserIds:
          type: array
          items:
            type: integer
        kind:
          type: string
        replyToId:
          type: ["integer", "null"]
        replyToBody:
          type: ["string", "null"]
        replyToUserName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ChatMessageDeleteResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    ChatMessageInput:
      type: object
      properties:
        body:
          type: string
        objectPath:
          type: string
          minLength: 1
        fileName:
          type: string
          minLength: 1
        mentionUserIds:
          type: array
          items:
            type: integer
        mentionAll:
          type: boolean
        replyToId:
          type: integer
        kind:
          type: string
          enum: [text, voice]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SetupStatus:
      type: object
      required: [isSetupComplete]
      properties:
        isSetupComplete:
          type: boolean

    SetupInput:
      type: object
      required:
        [
          companyName,
          employerFullName,
          companyEmail,
          phone,
          password,
          confirmPassword,
        ]
      properties:
        companyName:
          type: string
          minLength: 1
        employerFullName:
          type: string
          minLength: 1
        companyEmail:
          type: string
        phone:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        confirmPassword:
          type: string
          minLength: 8

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    Role:
      type: string
      enum: [super_admin, hr, employee]

    UserStatus:
      type: string
      enum: [active, pending, inactive, suspended]

    EmploymentType:
      type: string
      enum: [full_time, part_time, contract, intern]

    EmploymentStatus:
      type: string
      enum: [probation, active, on_leave, suspended, terminated]

    PermissionKey:
      type: string
      enum:
        [
          manage_users,
          manage_employees,
          manage_departments,
          manage_company_settings,
          manage_attendance_settings,
          manage_leave,
          manage_projects,
          manage_finance,
          manage_invoices,
          manage_requisitions,
          manage_content,
          view_reports,
        ]

    PermissionDef:
      type: object
      required: [key, label, description]
      properties:
        key:
          $ref: "#/components/schemas/PermissionKey"
        label:
          type: string
        description:
          type: string

    SessionUser:
      type: object
      required:
        [id, companyId, fullName, email, phone, role, permissions, status, canCreateProjects, createdAt]
      properties:
        id:
          type: integer
        companyId:
          type: integer
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
        status:
          $ref: "#/components/schemas/UserStatus"
        canCreateProjects:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AuthSession:
      type: object
      required: [user, company]
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        company:
          $ref: "#/components/schemas/Company"

    Company:
      type: object
      required:
        [id, name, email, phone, domain, vision, mission, coreValues, annualLeaveDays, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        domain:
          type: string
        vision:
          type: ["string", "null"]
        mission:
          type: ["string", "null"]
        coreValues:
          type: ["string", "null"]
        annualLeaveDays:
          type: integer
        createdAt:
          type: string
          format: date-time

    CompanyUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
          minLength: 1
        vision:
          type: string
        mission:
          type: string
        coreValues:
          type: string
        annualLeaveDays:
          type: integer
          minimum: 0

    Holiday:
      type: object
      required: [id, companyId, date, name]
      properties:
        id:
          type: integer
        companyId:
          type: integer
        date:
          type: string
        name:
          type: string

    HolidayCreate:
      type: object
      required: [date, name]
      properties:
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        name:
          type: string
          minLength: 1

    ManagementUser:
      type: object
      required:
        [id, companyId, fullName, email, phone, role, permissions, status, createdAt]
      properties:
        id:
          type: integer
        companyId:
          type: integer
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
        status:
          $ref: "#/components/schemas/UserStatus"
        createdAt:
          type: string
          format: date-time

    PushPublicKey:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: string

    PushSubscriptionInput:
      type: object
      required: [endpoint, p256dh, auth]
      properties:
        endpoint:
          type: string
          minLength: 1
        p256dh:
          type: string
          minLength: 1
        auth:
          type: string
          minLength: 1

    PushUnsubscribeInput:
      type: object
      required: [endpoint]
      properties:
        endpoint:
          type: string
          minLength: 1

    ManagementUserInput:
      type: object
      required: [fullName, email, phone, password]
      properties:
        fullName:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [super_admin, hr]
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"

    ManagementUserUpdate:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        role:
          type: string
          enum: [super_admin, hr]
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
        status:
          $ref: "#/components/schemas/UserStatus"

    Department:
      type: object
      required: [id, companyId, name, description, employeeCount, members]
      properties:
        id:
          type: integer
        companyId:
          type: integer
        name:
          type: string
        description:
          type: string
        employeeCount:
          type: integer
        members:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentMember"

    DepartmentMember:
      type: object
      required: [id, fullName, jobTitle]
