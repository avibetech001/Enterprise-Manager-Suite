openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: 5th Element Enterprise Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication, first-time setup, and session management
  - name: company
    description: Company profile and settings
  - name: users
    description: Management (Employer/HR) user administration
  - name: employees
    description: Employee administration and activation
  - name: departments
    description: Department management
  - name: permissions
    description: RBAC permission catalog
  - name: notifications
    description: Management notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/setup-status:
    get:
      operationId: getSetupStatus
      tags: [auth]
      summary: Check whether first-time setup has been completed
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"

  /auth/setup:
    post:
      operationId: completeSetup
      tags: [auth]
      summary: Create the company and first Super Admin (Employer) account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInput"
      responses:
        "201":
          description: Setup completed, session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          description: Setup already completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/management-login:
    post:
      operationId: managementLogin
      tags: [auth]
      summary: Log in as Employer or HR via the Management Login portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/employee-login:
    post:
      operationId: employeeLogin
      tags: [auth]
      summary: Log in as an Employee via the Employee Login portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentSession
      tags: [auth]
      summary: Get the currently authenticated user and their permissions
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /company:
    get:
      operationId: getCompany
      tags: [company]
      summary: Get the company profile and settings
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCompany
      tags: [company]
      summary: Update company settings (Employer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdate"
      responses:
        "200":
          description: Updated company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /permissions:
    get:
      operationId: listPermissions
      tags: [permissions]
      summary: List the catalog of assignable RBAC permissions
      responses:
        "200":
          description: Permission catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionDef"

  /users:
    get:
      operationId: listManagementUsers
      tags: [users]
      summary: List Employer and HR management users
      responses:
        "200":
          description: Management users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagementUser"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createManagementUser
      tags: [users]
      summary: Create a new HR management user (Employer, or HR with permission)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementUserInput"
      responses:
        "201":
          description: Created HR user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementUser"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    patch:
      operationId: updateManagementUser
      tags: [users]
      summary: Update an HR user's details, permissions, or status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementUserUpdate"
      responses:
        "200":
          description: Updated management user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementUser"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteManagementUser
      tags: [users]
      summary: Remove an HR user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List departments
      responses:
        "200":
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /departments/{id}:
    patch:
      operationId: updateDepartment
      tags: [departments]
      summary: Update a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdate"
      responses:
        "200":
          description: Updated department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteDepartment
      tags: [departments]
      summary: Delete a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee and generate an activation link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created employee with activation link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee's details or status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /employees/{id}/reset-password:
    post:
      operationId: resetEmployeePassword
      tags: [employees]
      summary: Set a new password for an employee account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetEmployeePasswordInput"
      responses:
        "204":
          description: Password reset
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /employees/{id}/archive:
    post:
      operationId: archiveEmployee
      tags: [employees]
      summary: Archive an employee (records are never permanently deleted)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Archived employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /employees/{id}/restore:
    post:
      operationId: restoreEmployee
      tags: [employees]
      summary: Restore an archived employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/profile:
    get:
      operationId: getMyProfile
      tags: [employees]
      summary: Get the current employee's own full profile
      responses:
        "200":
          description: Own profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMyProfile
      tags: [employees]
      summary: Update permitted fields of one's own profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MyProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for the current management user
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "204":
          description: All marked read

  /employees/{id}/resend-activation:
    post:
      operationId: resendEmployeeActivation
      tags: [employees]
      summary: Regenerate an employee's activation link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee with refreshed activation link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "403":
          description: Not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /employees/activation/{token}:
    get:
      operationId: getActivationInfo
      tags: [employees]
      summary: Look up activation details for an employee activation token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Activation info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeActivationInfo"
        "404":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /employees/activate:
    post:
      operationId: activateEmployee
      tags: [employees]
      summary: Activate an employee account by setting their password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeActivateInput"
      responses:
        "200":
          description: Activated and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SetupStatus:
      type: object
      required: [isSetupComplete]
      properties:
        isSetupComplete:
          type: boolean

    SetupInput:
      type: object
      required:
        [
          companyName,
          employerFullName,
          companyEmail,
          phone,
          password,
          confirmPassword,
        ]
      properties:
        companyName:
          type: string
          minLength: 1
        employerFullName:
          type: string
          minLength: 1
        companyEmail:
          type: string
        phone:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        confirmPassword:
          type: string
          minLength: 8

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    Role:
      type: string
      enum: [super_admin, hr, employee]

    UserStatus:
      type: string
      enum: [active, pending, inactive, suspended]

    EmploymentType:
      type: string
      enum: [full_time, part_time, contract, intern]

    EmploymentStatus:
      type: string
      enum: [probation, active, on_leave, suspended, terminated]

    PermissionKey:
      type: string
      enum:
        [
          manage_users,
          manage_employees,
          manage_departments,
          manage_company_settings,
          manage_attendance_settings,
          view_reports,
        ]

    PermissionDef:
      type: object
      required: [key, label, description]
      properties:
        key:
          $ref: "#/components/schemas/PermissionKey"
        label:
          type: string
        description:
          type: string

    SessionUser:
      type: object
      required:
        [id, companyId, fullName, email, phone, role, permissions, status, createdAt]
      properties:
        id:
          type: integer
        companyId:
          type: integer
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
        status:
          $ref: "#/components/schemas/UserStatus"
        createdAt:
          type: string
          format: date-time

    AuthSession:
      type: object
      required: [user, company]
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        company:
          $ref: "#/components/schemas/Company"

    Company:
      type: object
      required: [id, name, email, phone, domain, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        domain:
          type: string
        createdAt:
          type: string
          format: date-time

    CompanyUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
          minLength: 1

    ManagementUser:
      type: object
      required:
        [id, companyId, fullName, email, phone, role, permissions, status, createdAt]
      properties:
        id:
          type: integer
        companyId:
          type: integer
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
        status:
          $ref: "#/components/schemas/UserStatus"
        createdAt:
          type: string
          format: date-time

    ManagementUserInput:
      type: object
      required: [fullName, email, phone, password]
      properties:
        fullName:
          type: string
          minLength: 1
        email:
          type: string
        phone:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"

    ManagementUserUpdate:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionKey"
        status:
          $ref: "#/components/schemas/UserStatus"

    Department:
      type: object
      required: [id, companyId, name, description, employeeCount]
      properties:
        id:
          type: integer
        companyId:
          type: integer
        name:
          type: string
        description:
          type: string
        employeeCount:
          type: integer

    DepartmentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string

    DepartmentUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string

    EmergencyContact:
      type: object
      required: [name, relationship, phone]
      properties:
        name:
          type: string
        relationship:
          type: string
        phone:
          type: string
        address:
          type: string

    EmploymentDetails:
      type: object
      required:
        [
          departmentId,
          jobTitle,
          employmentType,
          startDate,
          employmentStatus,
        ]
      properties:
        departmentId:
          type: ["integer", "null"]
        jobTitle:
          type: ["string", "null"]
        employmentType:
          oneOf:
            - $ref: "#/components/schemas/EmploymentType"
            - type: "null"
        startDate:
          type: ["string", "null"]
        employmentStatus:
          $ref: "#/components/schemas/EmploymentStatus"

    Employee:
      type: object
      required:
        [
          id,
          employeeCode,
          companyId,
          firstName,
          lastName,
          otherName,
          fullName,
          gender,
          dateOfBirth,
          nationality,
          phone,
          personalEmail,
          companyEmail,
          residentialAddress,
          state,
          city,
          profilePhotoUrl,
          emergencyContact,
          employment,
          accountStatus,
          archived,
          activationLink,
          createdAt,
        ]
      properties:
        id:
          type: integer
        employeeCode:
          type: string
        companyId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        otherName:
          type: ["string", "null"]
        fullName:
          type: string
        gender:
          type: ["string", "null"]
        dateOfBirth:
          type: ["string", "null"]
        nationality:
          type: ["string", "null"]
        phone:
          type: string
        personalEmail:
          type: ["string", "null"]
        companyEmail:
          type: string
        residentialAddress:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        city:
