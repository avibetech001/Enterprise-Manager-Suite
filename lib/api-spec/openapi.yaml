          type: string
          minLength: 1
        otherName:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        dateOfBirth:
          type: ["string", "null"]
        nationality:
          type: ["string", "null"]
        phone:
          type: string
          minLength: 1
        personalEmail:
          type: ["string", "null"]
        companyEmail:
          type: string
          minLength: 1
        canCreateProjects:
