        companyId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        otherName:
          type: ["string", "null"]
        fullName:
          type: string
        gender:
          type: ["string", "null"]
        dateOfBirth:
          type: ["string", "null"]
        nationality:
          type: ["string", "null"]
        phone:
          type: string
        personalEmail:
          type: ["string", "null"]
        companyEmail:
          type: string
        residentialAddress:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        profilePhotoUrl:
          type: ["string", "null"]
        emergencyContact:
          oneOf:
            - $ref: "#/components/schemas/EmergencyContact"
