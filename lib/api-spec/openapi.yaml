        departmentId:
          type: ["integer", "null"]
        jobTitle:
          type: string
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        startDate:
          type: string
        employmentStatus:
          $ref: "#/components/schemas/EmploymentStatus"
        canCreateProjects:
