kind = "web"
previewPath = "/"
title = "5th Element"
version = "1.0.0"
id = "artifacts/ems"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23782

[services.development]
run = "pnpm --filter @workspace/ems run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ems", "run", "build" ]
serve = "static"
publicDir = "artifacts/ems/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23782"
BASE_PATH = "/"
